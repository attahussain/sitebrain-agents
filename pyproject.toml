[project]
name = "sitebrain-agents"
version = "0.1.0"
description = "Multi-agent RAG assistant for construction site documents (LangGraph + Claude + LanceDB)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "langgraph>=1.2",
    "lancedb>=0.41",
    "fastembed>=0.9",
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
sitebrain = "sitebrain.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sitebrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
