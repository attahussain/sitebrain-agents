[project]
name = "sitebrain-agents"
version = "0.4.0"
description = "Multi-agent RAG assistant for construction site documents (LangGraph + Claude + LanceDB)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.8",
    "langgraph>=1.2",
    "lancedb>=0.41",
    "fastembed>=0.9",
    "pydantic>=2.10",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph-checkpoint-sqlite>=3.0",
    "redis>=5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "httpx>=0.27"]
# Visual page retrieval. GPU users: install a CUDA build of torch first (see README).
visual = ["colpali-engine>=0.3.18,<0.4", "pillow>=10"]

[project.scripts]
sitebrain = "sitebrain.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sitebrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
