name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      SITEBRAIN_PROVIDER: mock
      SITEBRAIN_EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t sitebrain:ci .
      - name: Start container and check /health
        run: |
          docker run -d --name sb -p 8000:8000 -e SITEBRAIN_PROVIDER=mock sitebrain:ci
          for i in $(seq 1 60); do
            if curl -fs localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs sb
          exit 1
